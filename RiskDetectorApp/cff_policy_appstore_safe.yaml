# CFF Policy v2 (App Store Safe) — 适用 cprisk-armor Pass 9 ControlFlowOrchestrator
#
# 审核友好配置：收窄 heavy/medium tier，更多函数保留在 light；
# 关闭 enable_pass8_cff_awareness（减少 InstructionSubstitution + CFF 双重加固的审核面）。
#
# 自 v7.4 起 dispatcher 变体由 per-function RNG 决定，消除 100% TBZ #0 模板化特征（P1a 修复）。
# B.cond / PACIASP / PACIBSP 块边界修复（CFF#23/#24）已在 Pass 9 二进制重写器层面生效，
# 与本策略文件无关，仅需确保使用 cprisk-armor >= v7.4 构建。
version: 2
functions:
  # 审核友好：收窄 heavy/medium，更多留在 light；never 与常规 policy 对齐（VM 全量覆盖、syscall、C 核心）
  heavy:
    - RiskDetectionEngine.fastDigestShortCircuit
    - ChallengeSession.transition
    - ChallengeSession.advance
    - anti_debug_watchdog.cprisk_watchdog_run_iteration
    - SignedRiskConclusion.sign
    - DeviceKeyDeriver.deriveKeyWithTrustInfo
    - PayloadCrypto.encrypt
    - PayloadCrypto.decrypt
    - ReportEnvelope.buildSignatureInput
    - StorageIntegrityGuard.sign
    - StorageIntegrityGuard.verify
    # 关键决策路径（defense-in-depth）
    - RiskDetectionEngine.scoreAndForceDecision
    - RiskDetectionEngine.treeCommitVerdict
    - DecisionTree.decide
    # v7.7 — 仅蜜罐期望值重组放 heavy（10 字节函数体，膨胀可控；丢失即蜜罐失效）
    - HoneypotConflictFieldProvider.expectedVendorB
    # v7.7 audit-fix F2: computeSeal 是主完整性链 blueprint — safe profile 之前
    # 同时降两档（CFF medium + VMP partial）使 safe 实质保护远低于"审核友好"目标。
    # 升回 heavy；VMP 维持 partial（full 仍受 review 风险约束）。
    - IntegrityChainSealProvider.computeSeal
    # v7.7 audit-fix F1: GF(2) 种子 immediate 在此函数 .rodata；safe profile 也加 heavy
    # init 一次性调用，性能成本可忽略。
    - cprisk_gf2_init_real

  medium:
    - ConditionNode.evaluate
    - ConditionExpression.evaluate
    - ScoreActionNode.evaluate
    - TrustChainManager.shouldRefreshAttestation
    - SignedRiskConclusion.verify
    - DeviceKeyDeriver.deriveKey
    - ReportEnvelope.verifySignature
    - ConfigSignatureVerifier.verify
    - CPRiskKit.validateSecureReportEnvelope
    - RemoteConfig.validate
    - StringDeobfuscator.xorDecode
    - CFFStateCodec.deriveSeed
    - CFFOpaquePredicates.parityFence
    - CFFOpaquePredicates.connectorGate
    - CFFOpaquePredicates.maskedEquals
    - cprisk_verify_anchor_hmac
    - cprisk_verify_with_derived_key
    - cprisk_verify_with_derived_key_and_request_binding_digest
    - cprisk_derive_device_key
    - cprisk_verify_trust_hook_surface_integrity
    - cprisk_verify_runtime_hook_surface_prologues
    # 关键决策函数：信号收集需要 CFF 保护（defense-in-depth）
    - RiskDetectionEngine.collectAndAugmentSignals
    # CFF 自保护 + 信任链密钥派生
    - ChallengeSession.markSubmitted
    - TrustChainManager.deriveSessionKey
    - TrustChainManager.buildKeyResolver
    # v7.7 — 主完整性链 + SE 签名 + GF(2) 入口（safe profile：从主版本的 heavy 降为 medium）
    # F2 fix: computeSeal 已提升至 heavy（见上方），此处不再列。
    - IntegrityChainSealProvider.signals
    - IntegrityChainSealProvider.buildCanonical
    - IntegritySealComputer.seal
    - SecureEnclaveSigner.sign
    - SecureEnclaveSigner.ensureKeyInternal
    - HoneypotConflictFieldProvider.signals
    - AppAttestActiveProbeProvider.signals
    - AppAttestActiveProbeProvider.runActiveProbe
    - cprisk_gf2_affine_transform_16
    - cprisk_gf2_affine_self_check
    - cprisk_gf2_compute_full_checksum
    # v7.7 audit-fix F10: drift 缓存清零判定函数（同主版本）
    - IntegrityChainSealProvider.clearDriftFromCacheIfNeeded

  light:
    - RandomizedDetection.detect
    - AntiTamperingDetector.detect
    - DetectorRegistry.detectAll
    - ChallengeTrigger.shouldTriggerBlindChallenge
    - AntiTamperingSignalProvider.signals
    - MutationPlanner.maybeShuffle
    - FridaDetector.detect
    - AppAttestSigner.generateAssertion
    - AppAttestSigner.resolveKeyId
    - SecureFileStore.read
    - SecureFileStore.write
    - cprisk_frida_runtime_snapshot
    - cprisk_detect_dbi_markers
    - cprisk_run_all_signal_probes
    - cprisk_probe_debugger_via_signal
    - cprisk_probe_exception_delivery_timeout
    - cprisk_detect_thread_exception_ports
    - cprisk_detect_hardware_breakpoints
    - cprisk_scan_instant_return_key_symbols_prefix
    - cprisk_scan_hook_surface_trampoline_prefixes
    - cprisk_is_being_traced_sysctl_only
    # v7.7 — 跨 session keychain kv + lifecycle observer + SE probe-cache helpers
    - LongitudinalStateStore.save
    - LongitudinalStateStore.load
    - LongitudinalStateStore.delete
    - LongitudinalStateStore.saveString
    - LongitudinalStateStore.loadString
    - AppLifecycleHeartbeatProvider.signals
    - AppLifecycleHeartbeatProvider.currentApplicationStateString
    - SecureEnclaveSigner.publicKeyX962
    - IntegrityChainSealProvider.kickOffSeal
    # v7.7 audit-fix F11: applicationStateString — UIApplication.State → String 映射函数
    - AppLifecycleHeartbeatProvider.applicationStateString
    # VM 解释器核心入口
    - cprisk_vm_entry
    - _cprisk_vm_entry
    - cprisk_vm_entry_alt1
    - _cprisk_vm_entry_alt1
    - cprisk_vm_entry_alt2
    - _cprisk_vm_entry_alt2
    - cprisk_vm_execute
    - _cprisk_vm_execute
    # VM interpreter core loops (App Store Safe: light tier)
    - cprisk_vm_interp_loop_a
    - cprisk_vm_interp_loop_b

  never:
    - direct_syscall.cprisk_direct_syscall0
    - direct_syscall.cprisk_direct_syscall6
    # 仅保留真正需要避开 CFF 的底层函数
    - RiskDetectorApp.App
    - CloudPhoneRiskKitTests
    - cprisk_verify_svc_stub_integrity
    - cprisk_verify_dlsym_prologue
    - cprisk_resolve_import
    - cprisk_deny_attach
    - cprisk_deny_attach_status
    - cprisk_deny_attach_effective_verify
    - cprisk_text_encrypt_service_idle
    - cprisk_text_on_demand_decrypt

  regionOnly:
    - RiskDetectionEngine.evaluate

anti_deobfuscation:
  enable_runtime_salt: true
  enable_fake_state_release_only: true
  enable_multi_dispatcher: true
  enable_default_poison_for_heavy: true
  enable_pass8_cff_awareness: false
