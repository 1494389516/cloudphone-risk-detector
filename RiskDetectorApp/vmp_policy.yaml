# Pass 13 — VMProtector policy (cprisk-armor)
# full: requested native replacement; currently rejected before Mach-O mutation
#       because native arguments, returns and complete instruction semantics are not preserved.
# partial: bytecode/metadata only (no __text patch); original native code still executes.
# never: excluded (wins over full/partial if duplicated)
# These lists express policy intent, not measured production protection status.
# LLVM IR-VMP is a separate isolated experiment; see experiments/ir-vmp/PROTECTION_SCOPE.md.
#
# ABI v3 注意事项（v7.4 起）：
#   - per-string KDF domain label、Path-A counter、configDigest 格式为 breaking changes；
#     构建时须同时更新 Swift producer（StringEncryptor/WhiteBoxProfile）与 C consumer（cprisk_string_decrypt/cprisk_whitebox）。
#   - 跨语言 ABI 一致性须核查 producer/consumer 与实际构建产物；已删除测试不能作为当前证据。
#   - VM S-box 已升级为 8-bit（Feistel-SPN 扩散增强），旧 4-bit 字节码不可兼容。

version: 1
anti_analysis:
  handler_duplication: true
opaque_vpc_encoding:
  enabled: true
# M3: explicit build-time requests below; enabled flags alone do not prove runtime effect or resistance.
hardening:
  protect_vm_interpreter_with_cff: true
  enable_dead_handler_injection: true
  opaque_vpc_predicate_chain: true
  interpreter_self_integrity_check: true
  interpreter_cff_tier: medium
  dispatch_table_keystream: true
  bytecode_immediate_keystream: true
  bytecode_segment_runtime_sha256: true
  anti_symbolic_heavy: true
  synthetic_branch_ind_budget: 3
  synthetic_branch_ind_rate: 0.75
  synthetic_branch_ind_max_per_function: 2
  synthetic_branch_ind_mode: semi_semantic
  synthetic_branch_ind_forward_span: 6
functions:
  full:
    - RiskDetectionEngine.collectAndAugmentSignals
    - RiskDetectionEngine.scoreAndForceDecision
    - RiskDetectionEngine.treeCommitVerdict
    - DecisionTree.decide
    - ChallengeSession.markSubmitted
    - TrustChainManager.deriveSessionKey
    - TrustChainManager.buildKeyResolver
    - cprisk_verify_anchor_hmac
    - cprisk_verify_with_derived_key
    - cprisk_verify_with_derived_key_and_request_binding_digest
    - cprisk_derive_device_key
    - cprisk_frida_runtime_snapshot
    - GumTrampolineDetector.detect
    - FridaMemoryLayoutDetector.detect
    # v7.6 additions: anti-bypass detector + whitebox PRF entry + dead-handler touch
    - RandomizedDetection.detect
    - cprisk_whitebox_evaluate_domain
    - cprisk_vm_dead_touch_i
    # v7.7 — 完整性主链 + 蜜罐期望值 XOR 重组
    # computeSeal 串接 GF(2)、SE 与 Keychain；expectedVendorB 重组 XOR 编码字节。
    # full 请求目前被整体阻断；没有这两个函数的实际 VM 执行或抗逆向强度证据。
    - IntegrityChainSealProvider.computeSeal
    - HoneypotConflictFieldProvider.expectedVendorB
  partial:
    - AnomalyDetector.detectRiskScoreAnomaly
    - ReportEnvelope.buildSignatureInput
    - PayloadCrypto.encrypt
    - PayloadCrypto.decrypt
    - ConfigSignatureVerifier.verify
    - RemoteConfig.validate
    - StorageIntegrityGuard.sign
    - StorageIntegrityGuard.verify
    - CPRiskKit.validateSecureReportEnvelope
    - FridaDetector.detect
    - AntiTamperingSignalProvider.signals
    - CPRiskKit.evaluate
    - UnixSocketSweepDetector.detect
    # v7.6 additions: watchdog provider + jailbreak + device fingerprint
    - AntiDebugWatchdogProvider.signals
    - JailbreakSignalProvider.signals
    - DeviceFingerprintProvider.signals
    # v7.7 — 4 个 article-inspired Provider 主入口 + SE 签名 + GF(2) seal + keychain 持久化
    # partial 仅记录候选字节码/元数据，不替换 signals() 的原生执行路径。
    # 未测量这些入口的 hook/trace 成本、解释执行开销或符号解析覆盖率。
    - IntegrityChainSealProvider.signals
    - HoneypotConflictFieldProvider.signals
    - AppAttestActiveProbeProvider.signals
    - AppAttestActiveProbeProvider.runActiveProbe
    - AppLifecycleHeartbeatProvider.signals
    - SecureEnclaveSigner.sign
    - SecureEnclaveSigner.ensureKeyInternal
    - IntegritySealComputer.seal
    # v7.7 audit-fix F6: 拆分后的 GF(2) 直入入口
    - IntegritySealComputer.sealFromDigestPrefix
    - LongitudinalStateStore.save
    - LongitudinalStateStore.load
    # GF(2) 默认种子与 FNV 常量可由公开生产源码获得；BSS 不代表参数保密。
    # partial 不删除原生实现或常量，不会让常量搜索自动失效。
    # 独立 IR-VMP 的 xorshift/FNV 样本通过主机差分，不等于下列两个入口已转换。
    - cprisk_gf2_init_real
    - cprisk_gf2_compute_full_checksum
    # delete/saveString 属于 drift 基线读写边界；partial 不提供入口替换。
    # 还须审查调用者和结果消费，不能把策略名单当作已完成保护。
    - LongitudinalStateStore.delete
    - LongitudinalStateStore.saveString
    # publicKeyX962 是公钥导出边界；服务端注册/验签与客户端结果消费须分别验证。
    # partial 不隐藏可调用入口，也不证明密钥替换攻击已被阻止。
    - SecureEnclaveSigner.publicKeyX962
  never:
    - direct_syscall.cprisk_direct_syscall0
    - direct_syscall.cprisk_direct_syscall6
    - cprisk_vm_entry
    - cprisk_vm_entry_alt1
    - cprisk_vm_entry_alt2
    # GF(2) 仿射核心继续排除在 Mach-O Pass 13 之外；此处不改变原保护意图。
    # self_check 和运行时矩阵生成是现有机制；不据此宣称矩阵不可恢复或已有实测 CFF 覆盖。
    # 尚无该函数的 IR-VMP 性能/体积/抗逆向测量，不能推断微秒到毫秒的开销变化。
    - cprisk_gf2_affine_transform_16
