name: RiskDetectorApp
options:
  bundleIdPrefix: com.cloudphonerisk
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
# Release: lower Swift reflection metadata emission (Xcode “Reflection Metadata Level” → minimal).
# Debug/Test: default `all` so Mirrors and tooling behave normally.
# cprisk-armor Pass 2 further scrubs Mach-O metadata; optional env:
#   CPRISK_METADATA_SCRUB_LEVEL=aggressive  (CLI: --metadata-scrub-level aggressive)
#
# Additional Release hardening (CloudPhoneRiskKit / CloudPhoneRiskAppCore / app):
#   - SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO — fewer compiler flags embedded in .swiftmodule artifacts.
#   - GCC_GENERATE_TESTING_SYMBOLS=NO — drop testing symbol generation in Release slices.
#
# Residual Swift metadata gaps (in-repo only; no full strip without armor pipeline):
#   - Public @objc / resilient interfaces still emit descriptors as required by ABI.
#   - Generics and protocol witnesses retain names needed for runtime casting.
#   - STRIP_SWIFT_SYMBOLS applies to the app target install strip; static libs are merged at link.
#   - SWIFT_REFLECTION_METADATA_LEVEL=minimal still emits field/type metadata required by the ABI;
#     “none” would break Mirror-heavy code paths — not enabled here.
#   - Class/type “aliasing” in Swift does not rename mangled symbols; it is cosmetic at source level only.
#   - @objc(CPR_…) on NSObject subclasses and @objc enums sets the ObjC runtime name (objc_getClass /
#     NSClassFromString); Swift source names stay the same for API consumers.
#   - Swift private / internal types still appear in metadata where required for resilience; no “strip class names”
#     flag exists without breaking dynamic casts; rely on armor Pass-2 + minimal reflection for release slices.

targets:
  CRiskCore:
    type: library.static
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/CRiskCore
        includes:
          - "**/*.c"
      - path: Sources/CRiskCore/include
        buildPhase: headers
        headerVisibility: public
      - path: BuildSupport/CRiskCore/CRiskCore-umbrella.h
        buildPhase: headers
        headerVisibility: public
      - path: BuildSupport/CRiskCore/module.modulemap
    settings:
      base:
        PRODUCT_NAME: CRiskCore
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        CLANG_ENABLE_MODULES: YES
        OTHER_CFLAGS: "$(inherited) -fvisibility=hidden"
        MODULEMAP_FILE: "$(SRCROOT)/BuildSupport/CRiskCore/module.modulemap"
        PUBLIC_HEADERS_FOLDER_PATH: include
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/CRiskCore/include"

  CloudPhoneRiskKit:
    type: library.static
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/CloudPhoneRiskKit
        includes:
          - "**/*.swift"
    dependencies:
      - target: CRiskCore
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CFNetwork.framework
      - sdk: CoreHaptics.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: CoreTelephony.framework
      - sdk: CoreVideo.framework
      - sdk: DeviceCheck.framework
      - sdk: LocalAuthentication.framework
      - sdk: Metal.framework
      - sdk: Network.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_NAME: CloudPhoneRiskKit
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Sources/CRiskCore/include"
      configs:
        Release:
          SWIFT_REFLECTION_METADATA_LEVEL: minimal
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
          GCC_GENERATE_TESTING_SYMBOLS: NO

  CloudPhoneRiskAppCore:
    type: library.static
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/CloudPhoneRiskAppCore
        includes:
          - "**/*.swift"
    dependencies:
      - target: CloudPhoneRiskKit
    settings:
      base:
        PRODUCT_NAME: CloudPhoneRiskAppCore
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
      configs:
        Release:
          SWIFT_REFLECTION_METADATA_LEVEL: minimal
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
          GCC_GENERATE_TESTING_SYMBOLS: NO

  RiskDetectorApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.xcassets"
    resources:
      - path: App/Resources/Assets.xcassets
      - path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudphonerisk.riskdetector
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_INTENTS_METADATA_GENERATION: NO
        ARMOR_PLACEHOLDER_DIR: "$(SRCROOT)/BuildSupport/ArmorPlaceholders"
        OTHER_LDFLAGS: >-
          $(inherited) -lCRiskCore
          -Wl,-headerpad,0x4000
          -Wl,-u,_cprisk_vm_entry
          -Wl,-u,_cprisk_vm_entry_alt1
          -Wl,-u,_cprisk_vm_entry_alt2
          -Wl,-sectcreate,__DATA,__swift5_types2,$(ARMOR_PLACEHOLDER_DIR)/string_table.bin
          -Wl,-sectcreate,__DATA,__swift5_proto2,$(ARMOR_PLACEHOLDER_DIR)/loader.bin
          -Wl,-sectcreate,__DATA,__swift5_mpenum,$(ARMOR_PLACEHOLDER_DIR)/protected_blob.bin
          -Wl,-sectcreate,__DATA,__swift5_aa,$(ARMOR_PLACEHOLDER_DIR)/anchor_a.bin
          -Wl,-sectcreate,__DATA,__swift5_ab,$(ARMOR_PLACEHOLDER_DIR)/anchor_b.bin
          -Wl,-sectcreate,__DATA,__swift5_ac,$(ARMOR_PLACEHOLDER_DIR)/anchor_c.bin
          -Wl,-sectcreate,__DATA,__swift5_ad,$(ARMOR_PLACEHOLDER_DIR)/anchor_d.bin
          -Wl,-sectcreate,__DATA,__swift5_acfun,$(ARMOR_PLACEHOLDER_DIR)/full_anchor.bin
          -Wl,-sectcreate,__DATA,__swift5_mdext,$(ARMOR_PLACEHOLDER_DIR)/whitebox_meta.bin
          -Wl,-sectcreate,__DATA,__swift5_mdbdy,$(ARMOR_PLACEHOLDER_DIR)/whitebox_code.bin
          -Wl,-sectcreate,__DATA,__swift5_mddsc,$(ARMOR_PLACEHOLDER_DIR)/whitebox_data.bin
          -Wl,-sectcreate,__DATA,__swift5_mdchk,$(ARMOR_PLACEHOLDER_DIR)/whitebox_tag.bin
          -Wl,-sectcreate,__DATA,__swift5_dyrel,$(ARMOR_PLACEHOLDER_DIR)/import_table.bin
          -Wl,-sectcreate,__DATA,__swift5_mhsav,$(ARMOR_PLACEHOLDER_DIR)/header_backup.bin
          -Wl,-sectcreate,__DATA,__swift5_ptmap,$(ARMOR_PLACEHOLDER_DIR)/chain_meta.bin
          -Wl,-sectcreate,__DATA,__swift5_cgenc,$(ARMOR_PLACEHOLDER_DIR)/text_encrypt.bin
          -Wl,-sectcreate,__DATA,__swift5_mdvrt,$(ARMOR_PLACEHOLDER_DIR)/vmp_dispatch.bin
          -Wl,-sectcreate,__DATA,__swift5_mdirt,$(ARMOR_PLACEHOLDER_DIR)/vmp_bytecode.bin
          -Wl,-sectcreate,__DATA,__sw5_builtin2,$(ARMOR_PLACEHOLDER_DIR)/sw5_builtin2.bin
          -Wl,-sectcreate,__DATA,__sw5_capture2,$(ARMOR_PLACEHOLDER_DIR)/sw5_capture2.bin
          -Wl,-sectcreate,__DATA,__sw5_typeref2,$(ARMOR_PLACEHOLDER_DIR)/sw5_typeref2.bin
         
          -Wl,-sectcreate,__DATA,__la_resolver2,$(ARMOR_PLACEHOLDER_DIR)/la_resolver2.bin
          -Wl,-sectcreate,__DATA,__stub_helper2,$(ARMOR_PLACEHOLDER_DIR)/stub_helper2.bin
          -Wl,-sectcreate,__DATA,__auth_got2,$(ARMOR_PLACEHOLDER_DIR)/auth_got2.bin
          -Wl,-sectcreate,__DATA,__nl_catlist,$(ARMOR_PLACEHOLDER_DIR)/nl_catlist.bin
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_STYLE: all
        STRIP_SWIFT_SYMBOLS: YES
        DEAD_CODE_STRIPPING: YES
      configs:
        Release:
          SWIFT_REFLECTION_METADATA_LEVEL: minimal
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_SERIALIZE_DEBUGGING_OPTIONS: NO
          GCC_GENERATE_TESTING_SYMBOLS: NO
    dependencies:
      - target: CloudPhoneRiskKit
      - target: CloudPhoneRiskAppCore
      - sdk: AppIntents.framework
        weak: true
    postBuildScripts:
      - name: Apply cprisk armor
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(DERIVED_FILE_DIR)/apply_cprisk_armor.stamp
        script: |
          set -e
          unset SDKROOT
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          TOOLROOT="${SRCROOT}/../cprisk-armor"
          EXEC="${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
          STAMP_PATH="${SCRIPT_OUTPUT_FILE_1}"
          mkdir -p "$(dirname "$STAMP_PATH")"

          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "note: cprisk-armor skipped for ${CONFIGURATION} build"
            /bin/date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP_PATH"
            exit 0
          fi

          if [ ! -d "$TOOLROOT" ] || [ ! -f "$EXEC" ]; then
            echo "warning: cprisk-armor skipped: missing toolroot or executable" >&2
            /bin/date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP_PATH"
            exit 0
          fi

          if [ -z "${CPRISK_ARMOR_KEY:-}" ]; then
            echo "warning: cprisk-armor skipped: CPRISK_ARMOR_KEY is not set" >&2
            /bin/date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP_PATH"
            exit 0
          fi

          (cd "$TOOLROOT" && swift build --disable-sandbox -c release --product cprisk-armor >/dev/null)
          BIN="$(cd "$TOOLROOT" && swift build --disable-sandbox -c release --show-bin-path)"
          TOOL="${BIN}/cprisk-armor"
          if [ ! -x "$TOOL" ]; then
            echo "error: cprisk-armor tool not found at $TOOL" >&2
            exit 1
          fi

          ARMOR_ARGS="--all"
          if [ "${CPRISK_ARMOR_PROFILE:-}" = "appstore-safe" ]; then
            ARMOR_ARGS="--pass3 --pass4 --pass5 --pass6 --pass7 --pass10 --pass11 --safety-profile appstore-safe"
          fi

          if [ -n "${CPRISK_ARMOR_ARGS:-}" ]; then
            ARMOR_ARGS="${CPRISK_ARMOR_ARGS}"
          fi

          VERBOSE_ARG=""
          if [ "${CPRISK_ARMOR_VERBOSE:-}" = "1" ]; then
            VERBOSE_ARG="--verbose"
          fi

          echo "note: running cprisk-armor ${ARMOR_ARGS} on $EXEC"
          "$TOOL" \
            --input "$EXEC" \
            --output "$EXEC" \
            $ARMOR_ARGS \
            $VERBOSE_ARG \
            --key "$CPRISK_ARMOR_KEY"

          /usr/bin/stat -f "%m %z" "$EXEC" > "$STAMP_PATH" || /bin/date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP_PATH"

      - name: Inject VM self-expect (mdvsk)
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(DERIVED_FILE_DIR)/inject_vm_self_expect.stamp
        script: |
          unset SDKROOT
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          TOOLROOT="${SRCROOT}/../cprisk-armor"
          EXEC="${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
          STAMP_PATH="${SCRIPT_OUTPUT_FILE_1}"
          mkdir -p "$(dirname "$STAMP_PATH")"

          if [ ! -d "$TOOLROOT" ] || [ ! -f "$EXEC" ]; then
            /bin/date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP_PATH"
            exit 0
          fi

          (cd "$TOOLROOT" && swift build --disable-sandbox -c release --product cprisk-vm-self-expect >/dev/null) || true
          BIN="$(cd "$TOOLROOT" && swift build --disable-sandbox -c release --show-bin-path)"
          TOOL="${BIN}/cprisk-vm-self-expect"
          if [ -x "$TOOL" ]; then
            TOOL_OUTPUT="$("$TOOL" --in "$EXEC" 2>&1)"
            TOOL_RC=$?
            if [ "$TOOL_RC" -ne 0 ]; then
              if [ -n "$TOOL_OUTPUT" ]; then
                printf '%s\n' "$TOOL_OUTPUT" | /usr/bin/sed 's/error:/note:/g' >&2
              fi
              echo "warning: cprisk-vm-self-expect: injection skipped for $EXEC" >&2
            elif [ -n "$TOOL_OUTPUT" ]; then
              printf '%s\n' "$TOOL_OUTPUT"
            fi
          fi

          /usr/bin/stat -f "%m %z" "$EXEC" > "$STAMP_PATH" || /bin/date -u +"%Y-%m-%dT%H:%M:%SZ" > "$STAMP_PATH"

  CloudPhoneRiskKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/CloudPhoneRiskKitTests
    dependencies:
      - target: CloudPhoneRiskKit
      - target: CRiskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudphonerisk.CloudPhoneRiskKitTests
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES

  CloudPhoneRiskAppCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/CloudPhoneRiskAppCoreTests
    dependencies:
      - target: CloudPhoneRiskAppCore
      - target: CloudPhoneRiskKit
      - target: CRiskCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudphonerisk.CloudPhoneRiskAppCoreTests
        ENABLE_TESTABILITY: YES
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RiskDetectorApp:
    build:
      targets:
        CRiskCore: all
        CloudPhoneRiskKit: all
        CloudPhoneRiskAppCore: all
        RiskDetectorApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CloudPhoneRiskKitTests
        - CloudPhoneRiskAppCoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
