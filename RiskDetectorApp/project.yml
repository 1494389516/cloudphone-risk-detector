name: RiskDetectorApp
options:
  bundleIdPrefix: com.cloudphonerisk
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CloudPhoneRiskKit:
    path: .

targets:
  RiskDetectorApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.xcassets"
    resources:
      - path: App/Resources/Assets.xcassets
      - path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cloudphonerisk.riskdetector
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: CloudPhoneRiskKit
        product: CloudPhoneRiskKit
      - package: CloudPhoneRiskKit
        product: CloudPhoneRiskAppCore
    postBuildScripts:
      - name: "cprisk-armor (Release)"
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            exit 0
          fi
          if [ -z "${CPRISK_ARMOR_KEY}" ]; then
            echo "warning: CPRISK_ARMOR_KEY not set, skipping cprisk-armor (Release build unarmored)"
            exit 0
          fi
          ARMOR_CLI="${PROJECT_DIR}/../cprisk-armor/.build/release/cprisk-armor"
          FRAMEWORK_BINARY="${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}/Frameworks/CloudPhoneRiskKit.framework/CloudPhoneRiskKit"
          if [ ! -f "${ARMOR_CLI}" ]; then
            echo "warning: cprisk-armor not built at ${ARMOR_CLI}, run: cd cprisk-armor && swift build -c release"
            exit 0
          fi
          if [ ! -f "${FRAMEWORK_BINARY}" ]; then
            echo "warning: CloudPhoneRiskKit.framework not found at ${FRAMEWORK_BINARY}, skipping armor"
            exit 0
          fi
          "${ARMOR_CLI}" --input "${FRAMEWORK_BINARY}" --output "${FRAMEWORK_BINARY}" --all --key "${CPRISK_ARMOR_KEY}"
        basedOnDependencyAnalysis: false

schemes:
  RiskDetectorApp:
    build:
      targets:
        RiskDetectorApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
