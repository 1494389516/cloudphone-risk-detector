name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Xcode ${{ matrix.xcode }})
    runs-on: macos-14
    strategy:
      matrix:
        xcode: ['15.4']
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        working-directory: RiskDetectorApp
        run: swift package resolve

      - name: Build SDK
        working-directory: RiskDetectorApp
        run: swift build -Xswiftc -suppress-warnings

      - name: Run tests
        working-directory: RiskDetectorApp
        run: swift test

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          curl -fsSLO https://github.com/realm/SwiftLint/releases/download/0.57.1/swiftlint_linux.zip
          unzip -o swiftlint_linux.zip -d swiftlint_extracted
          sudo cp swiftlint_extracted/swiftlint /usr/local/bin/
          sudo chmod +x /usr/local/bin/swiftlint

      - name: Run SwiftLint
        working-directory: RiskDetectorApp
        run: swiftlint lint --strict --reporter github-actions-logging
