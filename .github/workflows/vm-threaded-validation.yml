name: VM dispatch candidate validation (not production acceptance)
on:
  pull_request:
    paths:
      - 'experiments/vm-threaded-dispatch/**'
      - 'experiments/vm-post-handler-2a/**'
      - 'experiments/vm-opcode-zero-fault/**'
      - 'RiskDetectorApp/Sources/CRiskCore/cprisk_vm*'
      - '.github/workflows/vm-threaded-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage 2A historical equivalence
        run: python3 experiments/vm-post-handler-2a/run.py --clang "$(xcrun -f clang)" --candidate-ref d07b76404e19cd3dffd790fae55158c329d164c0 --output /tmp/vm-evidence/phase2a
      - name: Zero-mask regression
        run: python3 experiments/vm-opcode-zero-fault/run.py --cc "$(xcrun -f clang)" --output /tmp/vm-evidence/zero
      - name: Threaded correctness and bounded stack at O0 and O2
        run: |
          python3 experiments/vm-threaded-dispatch/run.py --cc "$(xcrun -f clang)" --opt O0 --output /tmp/vm-evidence/threaded-O0
          python3 experiments/vm-threaded-dispatch/run.py --cc "$(xcrun -f clang)" --opt O2 --output /tmp/vm-evidence/threaded-O2
      - name: Apple ARM64 object and musttail evidence
        run: python3 experiments/vm-threaded-dispatch/inspect_arm64.py --apple --cc "$(xcrun -f clang)" --objdump "$(xcrun -f llvm-objdump)" --output /tmp/vm-evidence/apple-object
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-host-and-apple-object
          path: |
            /tmp/vm-evidence/**/report.json
            /tmp/vm-evidence/**/*.ll
            /tmp/vm-evidence/**/*.asm
            /tmp/vm-evidence/**/corpus.txt
            /tmp/vm-evidence/**/stress.txt
  apple-release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Three clean linked iPhoneOS Release builds of stage 2A
        run: python3 experiments/vm-threaded-dispatch/apple_release.py --ref d07b76404e19cd3dffd790fae55158c329d164c0 --output /tmp/vm-apple-release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-stage2a-linked-release
          path: |
            /tmp/vm-apple-release/report.json
            /tmp/vm-apple-release/*.log
            /tmp/vm-apple-release/linkmap-*.txt
            /tmp/vm-apple-release/disassembly-*.txt
