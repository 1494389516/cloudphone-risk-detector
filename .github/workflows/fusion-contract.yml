name: Build and contract generation
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Generated wire contract is current
        run: python3 contracts/generate.py --check
      - name: Build armor tools
        run: swift build --package-path cprisk-armor
      - name: Checked-in Xcode project parses
        run: xcodebuild -list -project RiskDetectorApp/RiskDetectorApp.xcodeproj >/dev/null
      - name: Build SDK libraries
        run: swift build --package-path RiskDetectorApp
      - name: Architecture invariant checks
        run: python3 contracts/architecture_invariants.py
