# CI runs NO tests: there is no unit/integration test step in this workflow.
# A green run means “it builds and the generated contracts are current” —
# it does NOT mean the armor transforms, runtime decryption, or VM paths
# are functionally correct. Do not treat green CI as functional verification.
name: Build and contract generation
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      # Pinned to a full commit SHA (v4.2.2) — a mutable tag can be repointed.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Generated wire contract is current
        run: python3 contracts/generate.py --check
      - name: Build armor tools
        run: swift build --package-path cprisk-armor
      - name: Compile PAC and memory guard runtimes for arm64e
        run: >-
          xcrun --sdk iphoneos clang -arch arm64e -miphoneos-version-min=14.0
          -std=gnu11 -Werror=implicit-function-declaration -fsyntax-only
          -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)"
          RiskDetectorApp/Sources/CRiskCore/cprisk_pac.c
          RiskDetectorApp/Sources/CRiskCore/cprisk_memory_guard.c
      - name: Build checked-in Xcode app for iOS Simulator
        run: >-
          xcodebuild -quiet -project RiskDetectorApp/RiskDetectorApp.xcodeproj
          -scheme RiskDetectorApp -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build CODE_SIGNING_ALLOWED=NO
      - name: Build SDK libraries
        run: swift build --package-path RiskDetectorApp
      - name: Adapter configuration source gates
        run: python3 contracts/check_adapter_configuration_source.py
      - name: Architecture invariant checks
        run: python3 contracts/architecture_invariants.py
      - name: Generated threaded runtime is current
        run: python3 experiments/vm-cpsv-v2/generate_runtime.py --check
